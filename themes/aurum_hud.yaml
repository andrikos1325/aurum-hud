# Aurum HUD - a gold "command center" theme for Home Assistant (dark + light), with a Cyan variant.
# Install: see INSTALL.md. Uses only built-in theme variables (no custom cards, no external fonts or images).
Aurum HUD:
  modes:
    dark:
      # core palette
      primary-color: "#E0B84F"
      accent-color: "#FFD27A"
      rgb-primary-color: "224, 184, 79"
      rgb-accent-color: "255, 210, 122"
      primary-background-color: "#07090D"
      secondary-background-color: "#0E131B"
      primary-text-color: "#EFE7D4"
      secondary-text-color: "#A59C87"
      disabled-text-color: "#5E584C"
      text-primary-color: "#07090D"
      divider-color: "rgba(224, 184, 79, 0.16)"
      # background: soft gold glow behind the dashboard
      lovelace-background: "radial-gradient(1200px 700px at 78% 18%, rgba(224,184,79,0.13), transparent 60%), radial-gradient(900px 600px at 10% 95%, rgba(90,120,160,0.10), transparent 60%), #07090D"
      # cards: dark glass with a thin gold edge
      card-background-color: "rgba(14, 19, 27, 0.86)"
      ha-card-background: "rgba(14, 19, 27, 0.86)"
      ha-card-border-radius: "14px"
      ha-card-border-width: "1px"
      ha-card-border-color: "rgba(224, 184, 79, 0.28)"
      ha-card-box-shadow: "0 0 0 1px rgba(224,184,79,0.04), 0 8px 26px rgba(0,0,0,0.45), 0 0 22px rgba(224,184,79,0.07)"
      ha-dialog-border-radius: "16px"
      # header + sidebar
      app-header-background-color: "#07090D"
      app-header-text-color: "#E0B84F"
      app-header-border-bottom: "1px solid rgba(224, 184, 79, 0.18)"
      sidebar-background-color: "#0A0D12"
      sidebar-text-color: "#A59C87"
      sidebar-icon-color: "#8B836F"
      sidebar-selected-text-color: "#FFD27A"
      sidebar-selected-icon-color: "#E0B84F"
      # states + icons
      state-icon-color: "#C9A64A"
      state-cover-active-color: var(--primary-color)
      state-media_player-active-color: var(--primary-color)
      state-humidifier-on-color: var(--primary-color)
      state-active-color: "#FFD27A"
      state-inactive-color: "#6B6556"
      paper-item-icon-color: "#C9A64A"
      paper-item-icon-active-color: "#FFD27A"
      state-light-active-color: "#FFD27A"
      state-switch-active-color: "#E0B84F"
      state-climate-heat-color: "#FF9F43"
      state-climate-cool-color: "#5AB6E8"
      state-lock-locked-color: "#7FD8A6"
      state-lock-unlocked-color: "#FF8A65"
      # controls
      switch-checked-color: "#E0B84F"
      switch-checked-button-color: "#FFD27A"
      switch-checked-track-color: "#8C6F28"
      switch-unchecked-button-color: "#8B836F"
      switch-unchecked-track-color: "#2A2F38"
      slider-color: "#E0B84F"
      slider-bar-color: "#E0B84F"
      input-fill-color: "rgba(255, 255, 255, 0.04)"
      input-ink-color: "#EFE7D4"
      input-label-ink-color: "#A59C87"
      mdc-theme-primary: "#E0B84F"
      mdc-theme-on-primary: "#07090D"
      # status colours
      success-color: "#7FD8A6"
      warning-color: "#FFB74D"
      error-color: "#FF6B6B"
      info-color: "#5AB6E8"
      # badges + misc
      label-badge-red: "#FF6B6B"
      label-badge-blue: "#5AB6E8"
      label-badge-green: "#7FD8A6"
      label-badge-yellow: "#E0B84F"
      label-badge-grey: "#6B6556"
      code-editor-background-color: "#0E131B"
      markdown-code-background-color: "rgba(224, 184, 79, 0.08)"
      table-row-background-color: "#0E131B"
      table-row-alternative-background-color: "#111824"
    light:
      primary-color: "#A67C1E"
      accent-color: "#C8962E"
      rgb-primary-color: "166, 124, 30"
      rgb-accent-color: "200, 150, 46"
      primary-background-color: "#F7F3EA"
      secondary-background-color: "#EFE8D8"
      primary-text-color: "#1E1A12"
      secondary-text-color: "#6E6553"
      divider-color: "rgba(166, 124, 30, 0.18)"
      lovelace-background: "radial-gradient(1200px 700px at 78% 18%, rgba(200,150,46,0.12), transparent 60%), #F7F3EA"
      card-background-color: "#FFFDF7"
      ha-card-background: "#FFFDF7"
      ha-card-border-radius: "14px"
      ha-card-border-width: "1px"
      ha-card-border-color: "rgba(166, 124, 30, 0.25)"
      ha-card-box-shadow: "0 6px 20px rgba(80, 60, 20, 0.08)"
      app-header-background-color: "#F7F3EA"
      app-header-text-color: "#7A5A12"
      sidebar-background-color: "#F1EBDD"
      sidebar-selected-text-color: "#7A5A12"
      sidebar-selected-icon-color: "#A67C1E"
      state-icon-color: "#A67C1E"
      state-cover-active-color: var(--primary-color)
      state-media_player-active-color: var(--primary-color)
      state-humidifier-on-color: var(--primary-color)
      state-active-color: "#C8962E"
      switch-checked-color: "#A67C1E"
      switch-checked-button-color: "#C8962E"
      switch-checked-track-color: "#E2C987"
      success-color: "#2E9E62"
      warning-color: "#D98A1C"
      error-color: "#D64545"
      info-color: "#2C83B8"

