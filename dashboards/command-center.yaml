# Aurum HUD - example dashboard "Command Center" (built-in cards only: no HACS, no custom cards).
# Replace the entity IDs (e.g. light.kitchen_lights) with your own - see INSTALL.md, step 3.
title: Command Center
views:
  - title: Command Center
    path: home
    icon: mdi:shield-home
    type: sections
    max_columns: 4
    badges:
      - type: entity
        entity: sensor.outside_temperature
      - type: entity
        entity: sensor.outside_humidity
      - type: entity
        entity: alarm_control_panel.security
      - type: entity
        entity: lock.front_door
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Security
            icon: mdi:radar
          - type: tile
            entity: alarm_control_panel.security
            features:
              - type: alarm-modes
                modes: [armed_home, armed_away, disarmed]
            grid_options: {columns: 12}
          - type: tile
            entity: lock.front_door
          - type: tile
            entity: lock.kitchen_door
          - type: tile
            entity: cover.garage_door
          - type: tile
            entity: binary_sensor.movement_backyard
      - type: grid
        cards:
          - type: heading
            heading: Climate
            icon: mdi:thermostat
          - type: thermostat
            entity: climate.heatpump
            grid_options: {columns: 12}
          - type: tile
            entity: climate.ecobee
          - type: tile
            entity: humidifier.dehumidifier
          - type: weather-forecast
            entity: weather.demo_weather_south
            forecast_type: daily
            grid_options: {columns: 12}
      - type: grid
        cards:
          - type: heading
            heading: Lights
            icon: mdi:lightbulb-group
          - type: tile
            entity: light.kitchen_lights
            features:
              - type: light-brightness
            grid_options: {columns: 12}
          - type: tile
            entity: light.living_room_rgbww_lights
          - type: tile
            entity: light.office_rgbw_lights
          - type: tile
            entity: light.bed_light
          - type: tile
            entity: switch.decorative_lights
          - type: tile
            entity: cover.living_room_window
            features:
              - type: cover-open-close
            grid_options: {columns: 12}
      - type: grid
        cards:
          - type: heading
            heading: Energy & Air
            icon: mdi:lightning-bolt
          - type: gauge
            entity: sensor.power_consumption
            name: Power
            min: 0
            max: 3000
            needle: true
            segments:
              - from: 0
                color: var(--primary-color)
          - type: gauge
            entity: sensor.carbon_dioxide
            name: CO2
            min: 0
            max: 2000
            segments:
              - from: 0
                color: var(--primary-color)
          - type: tile
            entity: media_player.living_room
            features:
              - type: media-player-playback
              - type: media-player-volume-slider
            grid_options: {columns: 12}
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.outside_temperature
              - entity: sensor.outside_humidity
            grid_options: {columns: 12}
